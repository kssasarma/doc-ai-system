<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Docs-inator — System Architecture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #F0F4F8; }
    body {
      background: #F0F4F8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 60px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .page-eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      color: #4F46E5;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .page-sub {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 8px;
    }
    .page-hint {
      font-size: 11px;
      color: #94A3B8;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .page-hint svg { opacity: 0.6; }
    .diagram-outer {
      width: 100%;
      max-width: 1380px;
      overflow-x: auto;
      border-radius: 12px;
      box-shadow: 0 4px 32px rgba(15,23,42,0.10), 0 1px 4px rgba(15,23,42,0.06);
    }
    svg { display: block; width: 100%; min-width: 900px; }

    /* Clickable elements */
    .clickable { cursor: pointer; }
    .clickable:hover .card-bg { filter: brightness(0.96); }

    /* Detail panel */
    #detail-panel {
      position: fixed;
      top: 0; right: -480px;
      width: 460px;
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 40px rgba(15,23,42,0.15);
      z-index: 1000;
      transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
      overflow-y: auto;
      padding: 0;
    }
    #detail-panel.open { right: 0; }
    #panel-header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid #E2E8F0;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
    }
    #panel-close {
      position: absolute;
      top: 20px; right: 20px;
      background: #F1F5F9;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 18px;
      color: #64748B;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    #panel-close:hover { background: #E2E8F0; }
    #panel-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }
    #panel-title { font-size: 20px; font-weight: 700; color: #0F172A; margin-bottom: 4px; }
    #panel-subtitle { font-size: 13px; color: #64748B; }
    #panel-body { padding: 24px 28px 40px; }
    .detail-section { margin-bottom: 24px; }
    .detail-section h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 10px;
    }
    .detail-item {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: flex-start;
    }
    .detail-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .detail-text { font-size: 13.5px; color: #334155; line-height: 1.5; }
    .detail-text strong { color: #0F172A; font-weight: 600; }
    .detail-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin: 2px 3px 2px 0;
    }
    .tag-row { display: flex; flex-wrap: wrap; margin-top: 6px; gap: 4px; }

    /* Overlay */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.25);
      z-index: 999;
    }
    #overlay.open { display: block; }
  </style>
</head>

    function buildDetailHTML(id) {
      const d = DETAILS[id];
      if (!d) return null;

      document.getElementById('panel-icon').style.background = d.iconBg;
      document.getElementById('panel-icon').textContent = d.icon;
      document.getElementById('panel-title').textContent = d.title;
      document.getElementById('panel-subtitle').textContent = d.subtitle;
      document.getElementById('panel-title').style.color = '#0F172A';

      let html = '';
      for (const section of d.sections) {
        html += `<div class="detail-section">
          <h3>${section.heading}</h3>`;
        for (const item of section.items) {
          html += `<div class="detail-item">
            <div class="detail-dot" style="background:${d.color}"></div>
            <div class="detail-text"><strong>${item.label}:</strong> ${item.value}</div>
          </div>`;
        }
        html += '</div>';
      }
      return html;
    }

    function openPanel(id) {
      const html = buildDetailHTML(id);
      if (!html) return;
      document.getElementById('panel-body').innerHTML = html;
      document.getElementById('detail-panel').classList.add('open');
      document.getElementById('overlay').classList.add('open');
      document.getElementById('panel-close').focus();
    }

    function closePanel() {
      document.getElementById('detail-panel').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    // Click handlers
    document.querySelectorAll('.clickable').forEach(el => {
      el.addEventListener('click', () => openPanel(el.dataset.id));
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(el.dataset.id); }
      });
    });

    document.getElementById('panel-close').addEventListener('click', closePanel);
    document.getElementById('overlay').addEventListener('click', closePanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
  </script>
